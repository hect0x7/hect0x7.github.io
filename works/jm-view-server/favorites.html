<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>收藏图片 · 看本</title>
  <link rel="icon" type="image/png" href="static/icons/icon-192.png">
  <link rel="stylesheet" href="static/css/app.css?v=0.3.11">
  <link rel="stylesheet" href="static/css/favorites.css?v=0.3.11">
  <link rel="stylesheet" href="static/css/favorites-export.css?v=0.3.11">
  <script src="static/js/vfs-seed.js?v=0.3.11"></script>
  <script src="static/js/mock-backend.js?v=0.3.11"></script>
  <script defer src="static/js/page-bootstrap.js?v=0.3.11"></script>
  <script defer src="static/js/app.js?v=0.3.11"></script>
  <script defer src="static/js/app-shell.js?v=0.3.11"></script>
  <script defer src="static/js/favorites-export.js?v=0.3.11"></script>
  <script defer src="static/js/favorites-page.js?v=0.3.11"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="topbar"><a class="btn btn-outline" href="./index.html?path=%2Fworks"><span data-favorite-icon="arrowLeft" aria-hidden="true"></span>返回文件浏览</a></div>
    <div class="content favorites-content">
      <div class="favorites-head">
        <div class="favorites-title"><span class="favorites-feature-icon" data-favorite-icon="favoriteImages" aria-hidden="true"></span><div><h1>收藏图片</h1><p>把喜欢的画面留下来 · 阅读时双击收藏</p></div></div>
      </div>
      <section class="favorites-library-card">
        <div class="favorites-library-summary"><span class="favorites-feature-icon" data-favorite-icon="images" aria-hidden="true"></span><div><h2>你的原图收藏库</h2><p><b id="favoriteTotalCount">0</b> 张收藏 · <b id="favoriteAvailableCount">0</b> 张原图可用</p></div></div>
        <div class="favorites-library-actions" role="group" aria-label="收藏库操作">
          <a class="btn btn-outline favorite-icon-button" id="readFavorites" href="./jm_view.html?favorites=1" aria-label="看本收藏图" title="看本收藏图" hidden><span data-favorite-icon="book" aria-hidden="true"></span></a>
          <button class="btn btn-primary favorite-icon-button" type="button" data-open-favorites-export aria-label="导出收藏图" title="导出收藏图"><span data-favorite-icon="export" aria-hidden="true"></span></button>
        </div>
        <p class="favorites-library-note">可复制、复制并清空收藏或移动原图，同名文件自动加序号。</p>
      </section>
      <div class="favorites-section-title"><h2>收藏记录</h2><span>按收藏时间排列 · 最新在前</span></div>
      <div class="favorites-empty" id="favoritesEmpty"><span data-favorite-icon="images" aria-hidden="true"></span><p>还没有收藏图片，去看本页双击喜欢的图片吧。</p></div>
      <div class="favorites-grid"></div>
    </div>
  </main>
  <nav class="mobile-bar"></nav>
</div>

<dialog class="favorites-export-dialog" id="favoritesExportDialog" aria-labelledby="favoritesExportTitle">
  <form id="copyFavoritesForm" class="favorites-export-panel">
    <header class="favorites-export-header">
      <span class="favorites-feature-icon" data-favorite-icon="export" aria-hidden="true"></span>
      <div><h2 id="favoritesExportTitle">导出收藏原图</h2><p>选择目标目录，复制或移动收藏的原始文件</p></div>
      <button class="btn btn-ghost btn-icon" type="button" id="closeFavoritesExport" aria-label="关闭导出"><span data-favorite-icon="x" aria-hidden="true"></span></button>
    </header>
    <div class="favorites-export-columns">
    <section class="favorites-export-options" aria-label="导出设置">
    <fieldset class="favorites-export-mode"><legend>导出方式</legend>
      <label><input type="radio" name="exportMode" value="copy" checked><span><b>复制收藏</b><small>复制后保留收藏</small></span></label>
      <label><input type="radio" name="exportMode" value="copy_clear"><span><b>复制并清空收藏</b><small>保留来源文件，只清空成功记录</small></span></label>
      <label><input type="radio" name="exportMode" value="move"><span><b>移动原图并清空收藏</b><small>复制成功后，来源原图移入回收站</small></span></label>
    </fieldset>
    <div class="favorites-export-summary"><span data-favorite-icon="favoriteImages" aria-hidden="true"></span><span id="favoritesExportCount">正在读取收藏数量…</span><a href="./favorites.html" aria-label="查看收藏" title="查看收藏"><span data-favorite-icon="book" aria-hidden="true"></span></a></div>
    <div class="favorites-export-guarantees"><span><span data-favorite-icon="check" aria-hidden="true"></span><span id="favoritesRetentionHint">保留原图和收藏</span></span><span><span data-favorite-icon="copy" aria-hidden="true"></span>同名自动加序号</span></div>
    </section>
    <section class="favorites-export-destination" aria-label="目标与结果">
    <div class="favorites-export-fields">
    <label for="copyDestination">目标文件夹</label>
    <div class="favorites-destination-input"><span data-favorite-icon="folder" aria-hidden="true"></span><input id="copyDestination" name="destination" type="text" required placeholder="输入完整文件夹路径（如 /works/精选）" aria-describedby="copyDestinationHint" autocomplete="off"></div>
    <p id="copyDestinationHint" class="favorites-export-hint">填写目标文件夹路径，文件夹不存在时自动创建。</p>
    <div class="favorites-export-placeholder"><span data-favorite-icon="export" aria-hidden="true"></span><b>原始文件，直接导出</b><p>无需打包，同名自动避让。完成后在这里查看结果。</p></div>
    </div>
    <section class="favorites-export-result" id="copyFavoritesResult" role="status" aria-live="polite" hidden></section>
    </section>
    </div>
    <footer class="favorites-export-footer"><span>实际文件复制 · 不压缩图片</span><div class="favorites-export-footer-actions"><button class="btn btn-outline" type="button" id="favoritesEditExport" hidden><span data-favorite-icon="arrowLeft" aria-hidden="true"></span>返回设置</button><button class="btn btn-primary" type="submit" id="copyFavoritesButton"><span data-favorite-icon="export" aria-hidden="true"></span><span id="copyFavoritesButtonText">复制全部原图</span></button></div></footer>
  </form>
</dialog>
</body>
</html>
