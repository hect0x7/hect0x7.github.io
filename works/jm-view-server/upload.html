<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>上传文件 · jm-view-server</title>
<!-- PWA -->
<link rel="manifest" href="static/manifest.webmanifest">
<meta name="theme-color" content="#5b5bd6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="看本">
<link rel="icon" type="image/png" href="static/icons/icon-192.png">
<link rel="apple-touch-icon" href="static/icons/icon-192.png">
<link rel="stylesheet" href="static/css/app.css?v=0.3.13">
<script src="static/js/vfs-seed.js?v=0.3.13"></script>
<script src="static/js/mock-backend.js?v=0.3.13"></script>
<style>
  .dropzone {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--sp-3);
    padding: var(--sp-8) var(--sp-5);
    border: 2px dashed var(--border-strong);
    border-radius: var(--r-xl);
    background: var(--bg-elevated);
    text-align: center; cursor: pointer;
    transition: border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--brand);
    background: var(--brand-soft);
    transform: scale(1.01);
    box-shadow: var(--shadow-md);
  }
  .dropzone .dz-orb {
    width: 88px; height: 88px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--brand-soft); color: var(--brand);
    transition: transform .18s var(--ease);
  }
  .dropzone.dragover .dz-orb { transform: translateY(-2px) scale(1.05); }
  .dropzone .dz-orb svg { width: 48px; height: 48px; }
  .dropzone .dz-title { font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .dropzone .dz-sub { font-size: 14px; color: var(--text-secondary); }
  .dropzone .dz-sub a { color: var(--brand); font-weight: 500; text-decoration: none; }
  .dropzone .dz-hint { margin-top: var(--sp-1); font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

  .upload-target {
    display: flex; align-items: center; gap: var(--sp-3);
    margin-bottom: var(--sp-4);
    padding: var(--sp-3) var(--sp-4);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    background: color-mix(in srgb, var(--brand) 6%, var(--bg-elevated));
  }
  .upload-target .target-ico {
    width: 38px; height: 38px; border-radius: var(--r-md);
    display: grid; place-items: center; flex-shrink: 0;
    background: var(--brand-soft); color: var(--brand);
  }
  .upload-target .target-ico svg { width: 20px; height: 20px; }
  .upload-target .target-body { min-width: 0; }
  .upload-target .target-label {
    margin-bottom: 3px;
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
  }
  .upload-target .target-path {
    font-family: var(--font-mono); font-size: 13px; color: var(--text);
    overflow-wrap: anywhere;
  }

  .up-info-row {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-4);
    background: var(--bg-elevated);
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    margin-top: var(--sp-4);
  }
  .up-info-row .up-ico {
    width: 40px; height: 40px; border-radius: var(--r-md);
    display: grid; place-items: center; flex-shrink: 0;
    background: var(--brand-soft); color: var(--brand);
  }
  .up-info-row .up-ico svg { width: 20px; height: 20px; }
  .up-info-row .up-body { flex: 1; min-width: 0; }
  #fileName { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta-row { display: flex; gap: var(--sp-4); margin-top: var(--sp-1); }
  #fileSize, #fileType { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

  .progress-wrap { margin-top: var(--sp-4); }
  .progress-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-2); }
  .progress-label span { font-size: 13px; color: var(--text-secondary); }
  #progress-value { font-family: var(--font-mono); font-size: 13px; color: var(--brand); font-weight: 600; }
  .progress-track {
    position: relative; height: 6px; border-radius: var(--r-pill);
    background: var(--bg-sunken); overflow: hidden;
  }
  #mask {
    position: absolute; top: 0; right: 0;
    height: 100%;
    background: var(--bg-sunken);
    left: 0%;
    transition: left .3s var(--ease);
  }
  .progress-track::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--brand);
    border-radius: var(--r-pill);
  }

  .action-row {
    display: flex; gap: var(--sp-3); margin-top: var(--sp-5);
    flex-wrap: wrap;
  }
  .action-row .btn { flex: 1; min-width: 120px; justify-content: center; }

  #result {
    margin-top: var(--sp-4);
    padding: var(--sp-3) var(--sp-4);
    background: color-mix(in srgb, var(--success) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--success) 30%, transparent);
    border-radius: var(--r-md);
    font-size: 14px; color: var(--text);
    line-height: 1.6;
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  #info { margin-top: var(--sp-2); }
  .file-detail-list {
    max-height: 180px; margin: 0; padding: var(--sp-3) var(--sp-4) var(--sp-3) 34px;
    overflow: auto; border: 1px solid var(--border); border-radius: var(--r-md);
    background: var(--bg-elevated); color: var(--text-secondary);
    font: 12px/1.7 var(--font-mono);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .rise { animation: rise .4s var(--ease) both; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <span style="font-size:15px;font-weight:600;letter-spacing:-0.01em">上传文件</span>
      <div class="spacer"></div>
    </div>

    <div class="content">
      <div class="content-narrow">
        <div class="page-head rise">
          <h1>上传文件</h1>
          <p>把一个或多个图片、压缩包拖到下方区域，或点击选择文件</p>
        </div>

        <div class="upload-target rise" style="animation-delay:.02s">
          <span class="target-ico" id="targetIco"></span>
          <div class="target-body">
            <div class="target-label">上传到</div>
            <div class="target-path" id="uploadTarget">/</div>
          </div>
        </div>

        <div class="dropzone rise" id="dropzone" style="animation-delay:.04s">
          <span class="dz-orb" id="dzOrb"></span>
          <div class="dz-title">拖拽一个或多个文件到此处</div>
          <div class="dz-sub">或 <a href="#" onclick="return false">点击多选文件</a></div>
          <div class="dz-hint">支持一次选择多个文件</div>
          <input type="file" name="file" id="file" multiple style="display:none">
        </div>

        <div class="up-info-row rise" style="animation-delay:.06s">
          <span class="up-ico" id="fileIco"></span>
          <div class="up-body">
            <div id="fileName" style="color:var(--text-muted)">尚未选择文件</div>
            <div class="meta-row">
              <span id="fileSize"></span>
              <span id="fileType"></span>
            </div>
          </div>
        </div>

        <div class="progress-wrap rise" style="animation-delay:.08s">
          <div class="progress-label">
            <span>上传进度</span>
            <span id="progress-value">0%</span>
          </div>
          <div class="progress-track">
            <div id="mask"></div>
          </div>
        </div>

        <div id="result" role="status" aria-live="polite" style="display:none"></div>
        <div id="info"></div>

        <div class="action-row rise" style="animation-delay:.1s">
          <button class="btn btn-outline" id="displayInfo" aria-expanded="false" onclick="fileSelected()">
            <span id="infoIco"></span> 显示信息
          </button>
          <button class="btn btn-primary" id="submit" onclick="uploadFile()">
            <span id="uploadIco"></span> 上&nbsp;&nbsp;传
          </button>
          <a class="btn btn-ghost" id="uploadBackBtn" href="./index.html"
             style="font-weight:600;color:var(--text)">返回</a>
        </div>

      </div>
    </div>
  </div>
  <nav class="mobile-bar"></nav>
</div>

<script src="static/js/page-bootstrap.js?v=0.3.13"></script>
<script src="static/js/app.js?v=0.3.13"></script>
<script src="static/js/app-shell.js?v=0.3.13"></script>
<script src="static/js/upload.js?v=0.3.13"></script>
<script>
  renderShell('upload');

  document.getElementById('dzOrb').innerHTML = icon('upload');
  document.getElementById('targetIco').innerHTML = icon('folder');
  document.getElementById('fileIco').innerHTML = icon('images');
  document.getElementById('infoIco').innerHTML = icon('list');
  document.getElementById('uploadIco').innerHTML = icon('upload');

  const dz = document.getElementById('dropzone');
  const fileInput = document.getElementById('file');
  dz.addEventListener('click', function(e) {
    if (e.target !== fileInput) fileInput.click();
  });

  ['dragenter', 'dragover'].forEach(function(ev) {
    dz.addEventListener(ev, function(e) { e.preventDefault(); dz.classList.add('dragover'); });
  });
  ['dragleave', 'dragend'].forEach(function(ev) {
    dz.addEventListener(ev, function(e) { e.preventDefault(); dz.classList.remove('dragover'); });
  });
  dz.addEventListener('drop', function(e) {
    e.preventDefault();
    dz.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      var dt = e.dataTransfer;
      try {
        Object.defineProperty(fileInput, 'files', { value: dt.files, writable: true, configurable: true });
      } catch(ex) {}
      var ev2 = new Event('change');
      fileInput.dispatchEvent(ev2);
    }
  });
</script>
</body>
</html>
